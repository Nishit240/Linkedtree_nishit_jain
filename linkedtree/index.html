<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishit Jain</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Custom Cursor -->
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="container">
        <div class="profile-card">
            <div class="avatar-3d">
                <div class="avatar-inner">
                    <div class="avatar-letter">N</div>
                </div>
            </div>
            <h1>Nishit Jain</h1>
            <p class="tagline">Computer Science Engineer • Developer • Problem Solver</p>
            <p class="contact-info">
                +91 78059 00204 | nishitjain02419@gmail.com | Indore, M.P.
            </p>
        </div>

        <div class="links-wrapper">
            <a href="https://linkedin.com/in/nishitjain" class="link-card" target="_blank">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>
            <a href="https://nishitjain-portfolio.netlify.app" class="link-card" target="_blank">
                <i class="fas fa-briefcase"></i>
                <span>Portfolio</span>
            </a>
            <a href="https://github.com/nishitjain" class="link-card" target="_blank">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>
        </div>

        <div class="contact-section">
            <h2>Get in Touch</h2>
            <form id="contactForm">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn-primary">Send Message</button>
            </form>
            <div id="formResponse" class="form-response"></div>
        </div>
    </div>

    <!-- Font Awesome CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="script.js"></script>
</body>
</html>
